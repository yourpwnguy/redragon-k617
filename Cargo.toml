[package]
name = "redragon-k617"
version = "0.1.0"
edition = "2021"
description = "Linux userspace driver for the Redragon K617 RGB (Sinowealth 258a:0049)"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.37"
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
